<meta name="description" content="Jeu gratuit pour enfants sur l'évolution : pars d'une minuscule cellule, mange, grandis et deviens poisson, reptile, oiseau ou singe !">
<link rel="canonical" href="https://www.la-cabane.app/jeux/evolution/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="La Cabane à Jeux">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://www.la-cabane.app/jeux/evolution/">
<meta property="og:title" content="Évolution — La Cabane à Jeux">
<meta property="og:description" content="Jeu gratuit pour enfants sur l'évolution : pars d'une minuscule cellule, mange, grandis et deviens poisson, reptile, oiseau ou singe !">
<meta property="og:image" content="https://www.la-cabane.app/og-image.jpg">
<meta property="og:image:width" content="1200">

<link rel="icon" href="../../favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <canvas id="game" aria-label="Évolution : ta créature nage dans l’océan"></canvas>

  <!-- HUD en jeu -->
  <div class="hud" id="hud" hidden>
    <div class="hud-left">
      <div class="hearts" id="hearts" role="img"></div>
      <div class="energy" id="energy" aria-label="Énergie" hidden><div class="energy-fill" id="energyFill"></div></div>
    </div>
    <div class="growth" id="growth" role="img">
      <span class="growth-icon" id="growthIcon"></span>
      <div class="growth-bar"><div class="growth-fill" id="growthFill"></div></div>
      <span class="growth-count" id="growthCount"></span>
    </div>
    <button id="pauseBtn" class="hud-btn" aria-label="Pause">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg>
    </button>
  </div>

  <p class="hint" id="hint" aria-live="polite"></p>
  <p class="toast" id="toast" aria-live="polite"></p>

  <!-- Commandes tactiles (cachées tant que l'écran n'a pas été touché) -->
  <div class="joy" id="joyBase" aria-hidden="true"><div class="joy-knob" id="joyKnob"></div></div>
  <button class="action-btn" id="actionBtn" aria-label="Action" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 3 6 13h5l-1 8 7-10h-5z"/></svg>
  </button>

  <!-- Écran titre -->
  <div class="overlay title-screen" id="titleScreen" hidden>
    <div class="title-box">
      <h1 class="logo">Évolution</h1>
      <p class="pitch" id="titlePitch"></p>
      <div class="menu">
        <button id="playBtn" class="big-btn">▶ Jouer</button>
        <button class="big-btn ghost fs-toggle">Plein écran</button>
        <a class="big-btn ghost" href="../../">🏠 Retour à la Cabane</a>
      </div>
      <p class="ios-tip" id="titleTip" hidden></p>
    </div>
  </div>

  <!-- Intro d'étape -->
  <div class="overlay intro-screen" id="introScreen" hidden>
    <div class="card intro-card">
      <p class="intro-ago" id="introAgo"></p>
      <h2 id="introName"></h2>
      <p class="intro-goal"><span class="goal-icon" id="introGoalIcon"></span><span id="introGoal"></span></p>
      <p class="intro-danger"><span class="danger-dot" aria-hidden="true">!</span><span id="introDanger"></span></p>
      <button id="introGo" class="big-btn">C’est parti&nbsp;!</button>
    </div>
  </div>

  <!-- Plus de cœurs -->
  <div class="overlay" id="lostScreen" hidden>
    <div class="card">
      <h2 id="lostTitle"></h2>
      <p class="card-text" id="lostText"></p>
      <button id="lostGo" class="big-btn">On repart&nbsp;!</button>
    </div>
  </div>

  <!-- Fiche découverte -->
  <div class="overlay" id="cardScreen" hidden>
    <div class="card fiche" role="dialog" aria-labelledby="cardName">
      <div class="fiche-head">
        <canvas class="fiche-art" id="cardArt" aria-hidden="true"></canvas>
        <h2 id="cardName"></h2>
        <p class="fiche-example" id="cardExample"></p>
        <p class="fiche-when"><span class="fiche-label">Quand&nbsp;?</span> <span id="cardWhen"></span></p>
      </div>
      <div class="fiche-body">
        <div class="fiche-fact">
          <p class="fiche-label">💡 Le savais-tu&nbsp;?</p>
          <p id="cardFact"></p>
        </div>
        <div class="fiche-change">
          <span class="change-icon" id="cardChangeIcon"></span>
          <p><span class="fiche-label">Ce qui a changé</span><br><span id="cardChange"></span></p>
        </div>
        <div class="fiche-actions">
          <button id="cardListen" class="big-btn ghost">🔊 Écouter</button>
          <button id="cardNext" class="big-btn">Continuer ▶</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Des millions d'années plus tard… -->
  <div class="overlay transition-screen" id="transitionScreen" hidden>
    <div class="transition-box">
      <p class="trans-title" id="transTitle"></p>
      <p class="trans-ago" id="transAgo"></p>
      <p class="trans-text" id="transText"></p>
    </div>
    <button id="transSkip" class="skip-btn">Passer ▶</button>
  </div>

  <!-- À suivre -->
  <div class="overlay" id="sequelScreen" hidden>
    <div class="card">
      <h2 id="sequelTitle"></h2>
      <p class="card-text" id="sequelText"></p>
      <div class="menu">
        <button id="sequelReplay" class="big-btn">🔄 Rejouer</button>
        <button id="sequelMenu" class="big-btn ghost">Menu</button>
      </div>
    </div>
  </div>

  <!-- Pause -->
  <div class="overlay" id="pauseOverlay" hidden>
    <div class="card" role="dialog" aria-labelledby="pauseTitle">
      <h2 id="pauseTitle">Pause</h2>
      <div class="menu">
        <button id="resumeBtn" class="big-btn">▶ Reprendre</button>
        <button id="restartBtn" class="big-btn ghost">🔄 Recommencer l’étape</button>
        <button id="soundBtn" class="big-btn ghost">🔊 Son : oui</button>
        <button class="big-btn ghost fs-toggle">Plein écran</button>
        <button id="menuBtn" class="big-btn ghost">🏠 Menu principal</button>
      </div>
      <p class="ios-tip" id="iosTip" hidden></p>
    </div>
  </div>

  <p class="fps" id="fps" hidden></p>

  <script type="module" src="js/main.js"></script>
</body>
</html>
