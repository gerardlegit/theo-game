<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mémo Animaux — La Cabane à Jeux</title>
<meta name="description" content="Jeu de memory gratuit pour enfants : retrouve toutes les paires d'animaux le plus vite possible et grimpe dans le classement mondial !">
<link rel="canonical" href="https://www.la-cabane.app/jeux/memory/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="La Cabane à Jeux">
<meta property="og:locale" content="fr_FR">
<meta property="og:url" content="https://www.la-cabane.app/jeux/memory/">
<meta property="og:title" content="Mémo Animaux — La Cabane à Jeux">
<meta property="og:description" content="Jeu de memory gratuit pour enfants : retrouve toutes les paires d'animaux le plus vite possible et grimpe dans le classement mondial !">
<meta property="og:image" content="https://www.la-cabane.app/og-image.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="La Cabane à Jeux : une cabane dans un arbre, des jeux éducatifs pour apprendre en s'amusant">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="../../favicon.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <a class="back-link" href="../../index.html">← La Cabane</a>

  <header class="game-header">
    <h1>🧠 Mémo Animaux</h1>
    <p>Retrouve les paires d'animaux rares… et leurs grimaces les plus rigolotes !</p>
  </header>

  <section class="hud">
    <div class="hud-item">Coups : <span id="moves">0</span></div>
    <div class="hud-item">Paires : <span id="found">0</span> / 8</div>
    <button id="restart">Recommencer</button>
  </section>

  <div class="game-layout">
    <main class="board" id="board" aria-label="Plateau de jeu"></main>

    <aside class="leaderboard" id="leaderboard">
      <h2>🏆 Classement</h2>
      <p class="leaderboard-sub">Top 20 mondial du moins de coups</p>
      <ol class="leaderboard-list" id="leaderboardList"></ol>
    </aside>
  </div>

  <div class="win-banner" id="winBanner">
    <div class="win-card">
      <p class="win-title">Bravo ! 🎉</p>
      <p id="winStats"></p>

      <div id="scoreForm">
        <label for="pseudoInput" class="score-label">Entre ton pseudo pour rejoindre le classement :</label>
        <input type="text" id="pseudoInput" maxlength="18" placeholder="Ton pseudo">
        <div class="score-actions">
          <button id="saveScore">Enregistrer mon score</button>
          <button id="skipScore" class="ghost-btn">Passer</button>
        </div>
      </div>
      <p id="scoreSaved" class="score-saved">Score enregistré ! 🎉</p>

      <button id="playAgain">Rejouer</button>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
